name: Deployment
on:
  push:
    branches:
      - main
      - dev
jobs:
  test:
    strategy:
      matrix:
        version: [v1,v2,v3]
        tag: [1,2,3]
    environment: testing
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: test_output
        run: npm run test
      - name: Output information
        run: echo "step run tests failed but running output ${{ matrix.version }} ${{ matrix.tag }}"
  deploy:
    if: failure() && needs.test.result == 'failure'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "..."
