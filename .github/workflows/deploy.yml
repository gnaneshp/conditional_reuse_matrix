name: Deployment
on:
  push:
    branches:
      - main
      - dev
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        id: test_output
        run: npm run test
      - name: Output information
        run: echo "step run tests failed but running output "
  deploy:
    if: failure() && needs.test.result == 'failure'
    needs: test
    uses: ./.github/workflows/reusable.yaml
  result:
    if: failure()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: print output
        run: echo ${{ needs.deploy.outputs.output1 }}
